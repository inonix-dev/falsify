name: Bug report
description: Crash, wrong parsing, bad import, broken output
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Command plus the smallest CSV that triggers it.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: falsify --version
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python version and OS
      placeholder: "3.12.2, macOS 15"
    validations:
      required: true
