[project]
name = "falsify"
version = "0.1.0"
description = "Deterministic overfitting/lookahead checks for backtested trading strategies"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
falsify = "falsify.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
